[package]
name = "peercord"
version = "0.1.0"
description = "Decentralized P2P LAN alternative to Discord"
authors = ["PeerCord"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "peercord_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }

mdns-sd = "0.11"
local-ip-address = "0.6"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
